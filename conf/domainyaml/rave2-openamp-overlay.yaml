reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2

  ddrboot@9800100:
    label: ddrboot
    no-map: 1
    start: 0x9800100
    size: 0x5FF00
  vdev0vring0@9860000:
    label: vdev0vring0
    start: 0x9860000
    size: 0x4000
    no-map: 1
  vdev0vring1@9864000:
    label: vdev0vring1
    start: 0x9864000
    size: 0x4000
    no-map: 1
  vdev0buffer@9868000:
    label: vdev0buffer
    size: 0x40000
    start: 0x9868000
    no-map: 1
  rsctbl@9800000:
    label: rsctbl
    start: 0x9800000
    size: 0x100
    no-map: 1

domains:
  APU_Linux:
    compatible: openamp,domain-v1
    reserved-memory:
      - vdev0vring0@9860000
      - vdev0vring1@9864000
      - vdev0buffer@9868000
      - ddrboot@9800100
      - rsctbl@9800000

    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      remoteproc-relation:
        compatible: openamp,remoteproc-v2
        relation0:
          remote: RPU_2_Zephyr
          elfload: [ r52_0b_atcm_global, r52_0b_btcm_global, r52_0b_ctcm_global, ddrboot@9800100, rsctbl@9800000 ]

      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          remote: RPU_2_Zephyr
          carveouts: [ vdev0vring0@9860000, vdev0vring1@9864000, vdev0buffer@9868000 ]
          # OpenAMP uses the no-buffer pair: ipi2_nobuf (APU, A78_0) <-> ipi1_nobuf (RPU_2, R52_2)
          mbox: ipi_2_nobuf_to_ipi_1_nobuf # OpenAMP example app (APU side)

  RPU_2_Zephyr:
    compatible: openamp,domain-v1
    chosen:
      stdout-path: "serial1:115200n8"
      bootargs: "earlycon=pl011,mmio32,0xf1930000 console=ttyAMA1,115200"
      zephyr,console: "serial1"
      zephyr,shell-uart: "serial1"
    xlnx,ddr-boot: true
    xlnx,zephyr,mems: [ ddrboot@9800100 ]
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          host: APU_Linux
          mbox: ipi_1_nobuf_to_ipi_2_nobuf # OpenAMP example app (RPU side)
          carveouts: [ vdev0vring0@9860000, vdev0vring1@9864000, vdev0buffer@9868000 ]
    # Physical core verified per R52_TCM_CLUSTER_ADDRESSING_FINDINGS.md: Cluster B,
    # core 0 (TCM base 0xEBA80000). "RPU_2_Zephyr" is our own human-readable
    # domain name (mirrors VEK385's RPU_Zephyr) -- cluster_cpu: cortexr52_2 in
    # the base overlay (rave2-rpu-base-overlay.yaml) is what actually binds
    # this domain to physical Cluster B; the TCM addresses below are what
    # Lopper uses to place it there, not the domain name itself. os,type:
    # zephyr (set in the base overlay) because the full OpenAMP remoteproc/
    # rpmsg stack needs an RTOS implementation -- libmetal (RPU_4_BM) is the
    # one that can run on pure baremetal.
    sram:
      - dev: ddrboot@9800100
        start: 0x9800100
        size: 0x5FF00
      - dev: r52_0b_atcm_global@eba80000
        label: r52_0b_atcm_global
        size: 64K
        spec_name: R52_0B_ATCM_GLOBAL
        start: '0xeba80000'
      - dev: r52_0b_btcm_global@eba90000
        label: r52_0b_btcm_global
        size: 32K
        spec_name: R52_0B_BTCM_GLOBAL
        start: '0xeba90000'
      - dev: r52_0b_ctcm_global@ebaa0000
        label: r52_0b_ctcm_global
        size: 32K
        spec_name: R52_0B_CTCM_GLOBAL
        start: '0xebaa0000'
    reserved-memory:
        - ddrboot@9800100
