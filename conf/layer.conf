# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-versal-hexcam-hardware"
BBFILE_PATTERN_meta-versal-hexcam-hardware = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-versal-hexcam-hardware = "6"

LAYERDEPENDS_meta-versal-hexcam-hardware = "core"
LAYERSERIES_COMPAT_meta-versal-hexcam-hardware = "kirkstone langdale scarthgap"

# Machine settings that must survive the gen-machine conf import, which
# regenerates conf/machine/<machine>.conf and wipes any hand edits.
require ${LAYERDIR}/conf/machine/include/erica-sentry-fpd.inc
