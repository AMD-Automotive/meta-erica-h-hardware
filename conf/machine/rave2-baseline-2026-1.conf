#@TYPE: Machine
#@NAME: rave2-baseline-2026-1
#@DESCRIPTION: Machine configuration for the rave2-baseline-2026-1 boards.


BBMULTICONFIG += "rave2-baseline-2026-1-microblaze-pmc rave2-baseline-2026-1-microblaze-riscv-asu"

#### Preamble
MACHINEOVERRIDES =. "${@['', 'rave2-baseline-2026-1:']['rave2-baseline-2026-1' !='${MACHINE}']}"
#### Regular settings follow
TUNEFILE[microblaze-pmc] = "conf/machine/include/rave2-baseline-2026-1/microblaze.inc"
TUNEFILE[microblaze-v-asu] = "conf/machine/include/rave2-baseline-2026-1/microblaze-v.inc"

# Platform Loader and Manager
PLM_DEPENDS = ""
PLM_MCDEPENDS = "mc::rave2-baseline-2026-1-microblaze-pmc:plm-firmware:do_deploy"
PLM_DEPLOY_DIR = "${TMPDIR}-rave2-baseline-2026-1-microblaze-pmc/deploy/images/${MACHINE}"

# ASU Firmware
ASU_DEPENDS = ""
ASU_MCDEPENDS = "mc::rave2-baseline-2026-1-microblaze-riscv-asu:asu-firmware:do_deploy"
ASU_DEPLOY_DIR = "${TMPDIR}-rave2-baseline-2026-1-microblaze-riscv-asu/deploy/images/${MACHINE}"

# Set the default (linux) domain device tree
CONFIG_DTFILE_DIR := "${@bb.utils.which(d.getVar('BBPATH'), 'conf/dts/rave2-baseline-2026-1')}"
CONFIG_DTFILE ?= "${CONFIG_DTFILE_DIR}/cortexa78-linux.dts"
CONFIG_DTFILE[vardepsexclude] += "CONFIG_DTFILE_DIR"

DTB_FILE_PATH ?= "${RECIPE_SYSROOT}/boot/devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

# Serial Console Settings
SERIAL_CONSOLES ?= "115200;ttyAMA0"

# Yocto arm-trusted-firmware(TF-A) variables
TFA_CONSOLE ?= "pl011_1"
TFA_BL33_LOAD ?= "0x40000000"

# Yocto OP-TEE variables
OPTEE_CONSOLE ?= "0"

# Yocto u-boot-xlnx variables

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x0"
SKIP_APPEND_BASEADDR ?= "1"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT ?= "0x20200000"
UBOOT_LOADADDRESS ?= "0x20200000"

# Yocto MACHINE_FEATURES Variable
MACHINE_FEATURES += "vcu2 malig78ae efi"

# Required generic machine inclusion
require conf/machine/versal-2ve-2vm-generic.conf

# QEMU Memory Configuration
QB_MEM = "-machine dynamic-mem=on -device amd-ddr-memory,address=0x800000000,size=0x380000000"

# This is an 'SDT' based BSP
XILINX_WITH_ESW = "sdt"

# Original SDT artifacts URL
SDT_URI = "https://mkmartifactory.amd.com/artifactory/SW-AutomotiveDevOps-DEV-LOCAL/ERICA-H/hardware/rave2_baseline_2026_09_01_da104f0e618aa3af793862dc793c110453e897f1.tar.gz"
SDT_URI[S] = "${WORKDIR}/sdt_artifacts"
SDT_URI[sha256sum] = "047e72ca74703f0e974003c07dcf3412a15a3da2abd28f08b697928bc8c18735"

# Set the system device trees
SYSTEM_DTFILE_DEPENDS = "sdt-artifacts"
SYSTEM_DTFILE_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
SYSTEM_DTFILE = "${SYSTEM_DTFILE_DIR}/system-top.dts"

# Load the dynamic machine features
include conf/machine/include/rave2-baseline-2026-1/${BB_CURRENT_MC}-features.conf
LIBXIL_CONFIG = "conf/machine/include/rave2-baseline-2026-1/${BB_CURRENT_MC}-libxil.conf"

# PDI variables
PDI_PATH_DEPENDS = "sdt-artifacts"
PDI_PATH_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
PDI_PATH = "${PDI_PATH_DIR}/versal_hexcam_20232_1_boot.pdi"

# Primary Bootmode value
DEFAULT_HW_BOOT_MODE = "8"

# Update bootbin to use proper device tree
BIF_PARTITION_IMAGE[device-tree] = "${DTB_FILE_PATH}"

# Remap boot files to ensure the right device tree is listed first
IMAGE_BOOT_FILES =+ "devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' rave2_baseline_2026_1']['rave2-baseline-2026-1' != '${MACHINE}']}"
