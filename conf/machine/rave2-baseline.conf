#@TYPE: Machine
#@NAME: rave2-baseline
#@DESCRIPTION: Machine configuration for the rave2-baseline boards.


BBMULTICONFIG += "rave2-baseline-microblaze-pmc rave2-baseline-microblaze-riscv-asu"

#### Preamble
MACHINEOVERRIDES =. "${@['', 'rave2-baseline:']['rave2-baseline' !='${MACHINE}']}"
#### Regular settings follow
TUNEFILE[microblaze-pmc] = "conf/machine/include/rave2-baseline/microblaze.inc"
TUNEFILE[microblaze-riscv-asu] = "conf/machine/include/rave2-baseline/microblaze-riscv.inc"

# Platform Loader and Manager
PLM_DEPENDS = ""
PLM_MCDEPENDS = "mc::rave2-baseline-microblaze-pmc:plm-firmware:do_deploy"
PLM_DEPLOY_DIR = "${TMPDIR}-rave2-baseline-microblaze-pmc/deploy/images/${MACHINE}"

# ASU Firware
ASU_DEPENDS = ""
ASU_MCDEPENDS = "mc::rave2-baseline-microblaze-riscv-asu:asu-firmware:do_deploy"
ASU_DEPLOY_DIR = "${TMPDIR}-rave2-baseline-microblaze-riscv-asu/deploy/images/${MACHINE}"

# Set the default (linux) domain device tree
CONFIG_DTFILE_DIR := "${@bb.utils.which(d.getVar('BBPATH'), 'conf/dts/rave2-baseline')}"
CONFIG_DTFILE ?= "${CONFIG_DTFILE_DIR}/cortexa78-linux.dts"
CONFIG_DTFILE[vardepsexclude] += "CONFIG_DTFILE_DIR"

# Yocto arm-trusted-firmware(TF-A) variables
TFA_CONSOLE ?= "pl011_1"
TFA_BL33_LOAD ?= "0x40000000"

# Yocto OP-TEE variables
OPTEE_CONSOLE ?= "0"

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x0"
SKIP_APPEND_BASEADDR ?= "1"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT  ?= "0x20200000"
UBOOT_LOADADDRESS ?= "0x20200000"

# Yocto MACHINE_FEATURES Variable
MACHINE_FEATURES += "vcu2 malig78ae"

# Required generic machine inclusion
require conf/machine/versal-2ve-2vm-generic.conf

# This is an 'SDT' based BSP
XILINX_WITH_ESW = "sdt"

# Original SDT artifacts URL
SDT_URI = "https://mkmartifactory.amd.com/artifactory/SW-AutomotiveDevOps-DEV-LOCAL/ERICA-H/hardware//rave2_baseline_2026_07_12_362de6e62e4adfa8417f740ca2264a0824833ac8.tar.gz"
SDT_URI[S] = "${WORKDIR}/sdt_artifacts"
SDT_URI[sha256sum] = "0c7b6bd75cdf5aa882013808513b23070b1f89dc0ce2f72075343f710e9c41f0"

# Set the system device trees
SYSTEM_DTFILE_DEPENDS = "sdt-artifacts"
SYSTEM_DTFILE_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
SYSTEM_DTFILE = "${SYSTEM_DTFILE_DIR}/system-top.dts"

# Load the dynamic machine features
include conf/machine/include/rave2-baseline/${BB_CURRENT_MC}-features.conf
LIBXIL_CONFIG = "conf/machine/include/rave2-baseline/${BB_CURRENT_MC}-libxil.conf"

# Versal PDI
PDI_PATH_DEPENDS = "sdt-artifacts"
PDI_PATH_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
PDI_PATH = "${PDI_PATH_DIR}/versal_hexcam_20232_1_boot.pdi"

# Update bootbin to use proper device tree
BIF_PARTITION_IMAGE[device-tree] = "${RECIPE_SYSROOT}/boot/devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

# Remap boot files to ensure the right device tree is listed first
IMAGE_BOOT_FILES =+ "devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' rave2_baseline']['rave2-baseline' != '${MACHINE}']}"
