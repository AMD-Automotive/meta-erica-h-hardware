#@TYPE: Machine
#@NAME: 5050a-versal
#@DESCRIPTION: Machine configuration for the 5050a-versal boards.

#### Preamble
MACHINEOVERRIDES =. "${@['', '5050a-single:']['5050a-single' !='${MACHINE}']}"
#### Regular settings follow

# Yocto device-tree variables
YAML_CONSOLE_DEVICE_CONFIG:pn-device-tree ?= "blp_cips_pspmc_0_psv_sbsauart_0"
YAML_MAIN_MEMORY_CONFIG:pn-device-tree ?= "C0_DDR_LOW0"
DT_PADDING_SIZE:pn-device-tree ?= "0x1000"
DTC_FLAGS:pn-device-tree ?= "-@"
YAML_DT_BOARD_FLAGS ?= "{BOARD template}"

# Yocto u-boot-xlnx variables
UBOOT_MACHINE ?= "xilinx_versal_virt_defconfig"

# Yocto arm-trusted-firmware(TF-A) variables
ATF_CONSOLE_DEFAULT ?= "pl011"
TFA_BL33_LOAD ?= "0x8000000"

# Yocto PLM variables
YAML_SERIAL_CONSOLE_STDIN:pn-plm-firmware ?= "blp_cips_pspmc_0_psv_sbsauart_0"
YAML_SERIAL_CONSOLE_STDOUT:pn-plm-firmware ?= "blp_cips_pspmc_0_psv_sbsauart_0"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT  ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"

# 5050a-versal Serial Console
SERIAL_CONSOLES ?= "115200;ttyAMA0"
YAML_SERIAL_CONSOLE_BAUDRATE ?= "115200"

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x00000000"
SKIP_APPEND_BASEADDR ?= "0"

# Required generic machine inclusion
require conf/machine/versal-ai-edge-generic.conf

# Topology for device tree and /etc entries
SV_DMS_TOPOLOGY ?= "TOPOLOGY_5050A_BRINGUP"
SV_DMS_TOPOLOGY_SHORT ?= "5050a_bringup"
SV_DMS_BOARD ?= "BOARD_5050A"
SV_DMS_BOARD_SHORT ?= "5050a"

# Add system XSA
HDF_MACHINE = "5050a-single"
HDF_EXT = "xsa"
HDF_BASE = "https://"
HDF_PATH = "mkmartifactory.amd.com:8443/artifactory/SW-AutomotiveDevOps-DEV-LOCAL/ERICA-H/hardware/5050a/5050a-qdma-cam-20232_2-2025_02_06.xsa"
SRC_URI[sha256sum] = "b780eb9522aca1728fa00223482fcebd5bc4fe4ab7f898c09424c8a644f670e8"

# We dont have DPU/AIE firmware just yet
BBMASK += "/meta-erica-h/recipes-bsp/dms-dpu-firmware/dms-dpu-firmware.bb"
BBMASK += "/meta-erica-h/recipes-bsp/aie-image-cdo/aie-image-cdo.bb"


#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' 5050a_single']['5050a-single' != '${MACHINE}']}"