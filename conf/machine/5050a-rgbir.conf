#@TYPE: Machine
#@NAME: 5050a-rgbir
#@DESCRIPTION: Machine configuration for the 5050a-versal boards.

#### Preamble
MACHINEOVERRIDES =. "${@['', '5050a-rgbir:']['5050a-rgbir' !='${MACHINE}']}"
#### Regular settings follow

# Yocto device-tree variables
YAML_CONSOLE_DEVICE_CONFIG:pn-device-tree ?= "CIPS_0_pspmc_0_psv_sbsauart_0"
YAML_MAIN_MEMORY_CONFIG:pn-device-tree ?= "C0_DDR_LOW0"
DT_PADDING_SIZE:pn-device-tree ?= "0x1000"
DTC_FLAGS:pn-device-tree ?= "-@"
YAML_DT_BOARD_FLAGS ?= "{BOARD template}"

# Yocto u-boot-xlnx variables
UBOOT_MACHINE ?= "xilinx_versal_virt_defconfig"

# Yocto arm-trusted-firmware(TF-A) variables
ATF_CONSOLE_DEFAULT ?= "pl011"
TFA_BL33_LOAD ?= "0x8000000"

# Yocto PLM variables
YAML_SERIAL_CONSOLE_STDIN:pn-plm-firmware ?= "CIPS_0_pspmc_0_psv_sbsauart_0"
YAML_SERIAL_CONSOLE_STDOUT:pn-plm-firmware ?= "CIPS_0_pspmc_0_psv_sbsauart_0"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT  ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"

# 5050a-versal Serial Console
SERIAL_CONSOLES ?= "115200;ttyAMA0"
YAML_SERIAL_CONSOLE_BAUDRATE ?= "115200"

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x00000000"
SKIP_APPEND_BASEADDR ?= "0"

# Required generic machine inclusion
require conf/machine/versal-ai-edge-generic.conf

# Topology for device tree and /etc entries
SV_DMS_TOPOLOGY ?= "TOPOLOGY_RGBIR"
SV_DMS_TOPOLOGY_SHORT ?= "5050a_rgbir"
SV_DMS_BOARD ?= "BOARD_5050A"
SV_DMS_BOARD_SHORT ?= "5050a"
SV_DMS_USE_DUMMY_DISPLAY ?= "1"
SV_DMS_USE_PCIE_CAPTURE_PIPE ?= "1"

QB_MEM = "-m 8G"
QEMU_HW_DTB_PS = "${QEMU_HW_DTB_PATH}/board-versal-ps-vek280.dtb"
QEMU_HW_DTB_PMC = "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"

# Add system XSA
HDF_MACHINE = "5050a-rgbir"
HDF_EXT = "xsa"
HDF_BASE = "https://"
HDF_PATH = "mkmartifactory.amd.com:8443/artifactory/SW-AutomotiveDevOps-DEV-LOCAL/ERICA-H/hardware/sapphire_5050a_rgbir_2025_03_17_ae7c62c7bfe3532f26e594472a1c6cca0205a3cb.xsa"
SRC_URI[sha256sum] = "94becd584889c0f4f2df3645a5d8ab137249f67f47fff13823980a2f2334f9f8"

DMS_DPU_FIRMWARE = "https://mkmartifactory.amd.com:8443/artifactory/SW-AutomotiveDevOps-DEV-LOCAL/ERICA-H/hardware/sapphire_5050a_rgbir_2025_03_17_ae7c62c7bfe3532f26e594472a1c6cca0205a3cb.tar.gz"
DMS_DPU_FIRMWARE_CHECKSUM = "c77954c8bb708d8a2a9bcced2f61173676143c3fbbc23678f501f4bc94cf4c21"

IMAGE_INSTALL:append = " dms-dpu-firmware dms-dpu-firmware-ptest"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' 5050a_rgbir']['5050a-rgbir' != '${MACHINE}']}"
